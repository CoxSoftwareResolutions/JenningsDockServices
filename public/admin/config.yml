backend:
  name: github
  repo: CoxSoftwareResolutions/JenningsDockServices
  branch: main

# Media settings
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - label: "Home Page Content"
        name: "home_page"
        file: "src/data/content.json"
        fields:
          - label: "Site Copy & Navigation"
            name: "site"
            widget: "object"
            fields:
              - {
                  label: "Page Title Suffix",
                  name: "pageTitleSuffix",
                  widget: "string",
                }
              - {
                  label: "Page Description",
                  name: "pageDescription",
                  widget: "text",
                }
              - {
                  label: "Social Sharing Image",
                  name: "socialImage",
                  widget: "image",
                  required: false,
                }
              - { label: "Brand Name", name: "brandName", widget: "string" }
              - { label: "Brand Subtitle", name: "brandSub", widget: "string" }
              - {
                  label: "Mobile Call Button",
                  name: "headerCtaShort",
                  widget: "string",
                }
              - label: "Navigation Links"
                name: "navLinks"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
              - {
                  label: "About Eyebrow",
                  name: "aboutEyebrow",
                  widget: "string",
                }
              - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
              - {
                  label: "Services Eyebrow",
                  name: "servicesEyebrow",
                  widget: "string",
                }
              - {
                  label: "Services Title",
                  name: "servicesTitle",
                  widget: "string",
                }
              - {
                  label: "Services Subtitle",
                  name: "servicesSubtitle",
                  widget: "text",
                }
              - {
                  label: "Gallery Eyebrow",
                  name: "galleryEyebrow",
                  widget: "string",
                }
              - {
                  label: "Gallery Title",
                  name: "galleryTitle",
                  widget: "string",
                }
              - {
                  label: "Gallery Subtitle",
                  name: "gallerySubtitle",
                  widget: "text",
                }
              - {
                  label: "Empty Gallery Message",
                  name: "galleryEmpty",
                  widget: "text",
                }
              - {
                  label: "Boat Lifts Eyebrow",
                  name: "boatLiftsEyebrow",
                  widget: "string",
                }
              - {
                  label: "Boat Length Label",
                  name: "boatLengthLabel",
                  widget: "string",
                }
              - {
                  label: "Water Depth Label",
                  name: "waterDepthLabel",
                  widget: "string",
                }
              - {
                  label: "Standard Frame Label",
                  name: "standardFrameLabel",
                  widget: "string",
                }
              - {
                  label: "Lift Inquiry Button",
                  name: "liftCta",
                  widget: "string",
                }
              - {
                  label: "Contact Eyebrow",
                  name: "contactEyebrow",
                  widget: "string",
                }
              - {
                  label: "Contact Title",
                  name: "contactTitle",
                  widget: "string",
                }
              - {
                  label: "Contact Subtitle",
                  name: "contactSubtitle",
                  widget: "text",
                }
              - {
                  label: "Call Button Prefix",
                  name: "callButtonPrefix",
                  widget: "string",
                }
              - { label: "Email Button", name: "emailButton", widget: "string" }
              - { label: "Hours Label", name: "hoursLabel", widget: "string" }
              - {
                  label: "Service Area Label",
                  name: "serviceAreaLabel",
                  widget: "string",
                }
              - {
                  label: "Address Label",
                  name: "addressLabel",
                  widget: "string",
                }
              - {
                  label: "Footer Tagline",
                  name: "footerTagline",
                  widget: "text",
                }
              - {
                  label: "Footer Contact Heading",
                  name: "footerContactTitle",
                  widget: "string",
                }
              - {
                  label: "Footer Hours Heading",
                  name: "footerHoursTitle",
                  widget: "string",
                }
              - {
                  label: "Footer Site Heading",
                  name: "footerSiteTitle",
                  widget: "string",
                }
              - {
                  label: "Footer Services Link",
                  name: "footerServicesLink",
                  widget: "string",
                }
              - {
                  label: "Footer Boat Lifts Link",
                  name: "footerBoatLiftsLink",
                  widget: "string",
                }
              - {
                  label: "Footer Contact Link",
                  name: "footerContactLink",
                  widget: "string",
                }
              - {
                  label: "Staff Login Label",
                  name: "staffLogin",
                  widget: "string",
                }
              - {
                  label: "Structured Data Description",
                  name: "structuredDataDescription",
                  widget: "text",
                }
              - {
                  label: "Thank-you Eyebrow",
                  name: "thanksEyebrow",
                  widget: "string",
                }
              - {
                  label: "Thank-you Title",
                  name: "thanksTitle",
                  widget: "string",
                }
              - {
                  label: "Thank-you Subtitle",
                  name: "thanksSubtitle",
                  widget: "text",
                }
              - {
                  label: "Back Home Button",
                  name: "backHome",
                  widget: "string",
                }

          - label: "Business Contact Details"
            name: "business"
            widget: "object"
            fields:
              - { label: "Business Name", name: "name", widget: "string" }
              - { label: "Phone Number", name: "phone", widget: "string" }
              - { label: "Email Address", name: "email", widget: "string" }
              - label: "Address"
                name: "address"
                widget: "object"
                fields:
                  - { label: "Street", name: "street", widget: "string" }
                  - { label: "City", name: "city", widget: "string" }
                  - { label: "State", name: "state", widget: "string" }
                  - { label: "ZIP Code", name: "zip", widget: "string" }
              - { label: "Service Area", name: "location", widget: "string" }
              - { label: "Operating Hours", name: "hours", widget: "string" }

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "CTA Button Text", name: "ctaText", widget: "string" }
              - {
                  label: "Background Image",
                  name: "bgImage",
                  widget: "image",
                  required: false,
                }

          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "About Paragraph", name: "paragraph", widget: "text" }
              - label: "Highlights / Stats"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Boat Lift Options"
            name: "boatLifts"
            widget: "object"
            fields:
              - {
                  label: "Section Title",
                  name: "sectionTitle",
                  widget: "string",
                }
              - {
                  label: "Section Subtitle",
                  name: "sectionSubtitle",
                  widget: "text",
                }
              - label: "Lift Categories"
                name: "categories"
                widget: "list"
                fields:
                  - {
                      label: "Category Name",
                      name: "categoryName",
                      widget: "string",
                    }
                  - label: "Models"
                    name: "models"
                    widget: "list"
                    fields:
                      - {
                          label: "Model Number",
                          name: "modelNumber",
                          widget: "string",
                        }
                      - {
                          label: "Lift Capacity",
                          name: "capacity",
                          widget: "string",
                        }
                      - {
                          label: "Max Boat Length",
                          name: "boatLength",
                          widget: "string",
                        }
                      - {
                          label: "Min Water Depth",
                          name: "waterDepth",
                          widget: "string",
                        }
                      - {
                          label: "Standard Frame Length",
                          name: "standardFrame",
                          widget: "string",
                        }

          - label: "Photo Gallery"
            name: "gallery"
            widget: "list"
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - {
                  label: "Caption / Description",
                  name: "caption",
                  widget: "string",
                }
